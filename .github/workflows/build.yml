name: Build macOS

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"   # dispara em: v1.0.0, v2.3.1, etc.
  workflow_dispatch:                # permite rodar manualmente
    inputs:
      version:
        description: "Tag de versão (ex: v1.2.3)"
        required: true
        default: "v0.0.0-test"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14     # Apple Silicon (arm64)
            arch: arm64
          # Intel (x86_64): macos-13 foi descontinuado no plano gratuito do GitHub.
          # Para builds Intel, use um self-hosted runner ou conta paga.
          # - runner: macos-13
          #   arch: x86_64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.arch }}

    steps:
      # ── 1. Código-fonte ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}   # necessário para clonar submodule privado (libs/ttwtools)

      # ── 2. Ambiente conda ──────────────────────────────────────────────
      - name: Instalar Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          activate-environment: ttw314
          environment-file: environment.yml
          auto-activate-base: false

      # ── 3. Cache pip (acelera reinstalls) ─────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ matrix.arch }}-${{ hashFiles('environment.yml') }}

      # ── 4. Cache PyInstaller _work (incremental build) ────────────────
      - name: Cache PyInstaller work
        uses: actions/cache@v4
        with:
          path: build/_work
          key: pyinstaller-${{ matrix.arch }}-${{ hashFiles('build/ttwtools-app.spec', 'app/**', 'libs/**') }}
          restore-keys: |
            pyinstaller-${{ matrix.arch }}-

      # ── 5. Frontend (npm build) ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-src/package.json

      - name: Build frontend
        working-directory: frontend-src
        run: |
          npm ci
          npm run build

      # ── 6. Pacotes locais (não estão no PyPI) ─────────────────────────
      - name: Instalar pacotes locais
        shell: bash -l {0}
        run: |
          pip install -e libs/ttwtools
          pip install -e .

      # ── 7. Modelos spaCy ────────────────────────────────────────────────
      # Instalado via `spacy download` e não via pip direto porque en-core-web-sm
      # declara Requires-Python <3.14 em seus metadados PyPI, bloqueando o pip.
      # O comando spacy download usa pip install com URL direta, ignorando isso.
      - name: Download modelos spaCy
        shell: bash -l {0}
        run: python -m spacy download en_core_web_sm

      # ── 9. PyInstaller ─────────────────────────────────────────────────
      - name: Build com PyInstaller
        shell: bash -l {0}
        run: |
          pyinstaller build/ttwtools-app.spec \
            --distpath dist \
            --workpath build/_work \
            --noconfirm

      # ── 10. Criar DMG ───────────────────────────────────────────────────
      - name: Instalar create-dmg
        run: brew install create-dmg

      - name: Determinar versão
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar DMG
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          DMG_NAME="ttwtools-${VERSION}-${{ matrix.arch }}.dmg"
          create-dmg \
            --volname "ttwtools ${VERSION}" \
            --volicon "build/icon.icns" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "ttwtools.app" 180 170 \
            --hide-extension "ttwtools.app" \
            --app-drop-link 480 170 \
            "${DMG_NAME}" \
            "dist/"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      # ── 11. Upload do artefato ──────────────────────────────────────────
      - name: Upload DMG como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ttwtools-${{ steps.version.outputs.tag }}-${{ matrix.arch }}
          path: "*.dmg"
          if-no-files-found: error

  # ── Release ──────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    # Só cria release quando disparado por tag (não em workflow_dispatch de teste)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Baixar todos os DMGs
        uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ttwtools ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-beta → pre-release
          generate_release_notes: true
          files: dmgs/*.dmg