name: Release

# Em tag v*.*.* (ex.: v0.4.0, v0.4.0-alpha.1): valida a tag, gera os pacotes em
# cada sistema (com --selftest do binário) e cria a release em RASCUNHO.
# Push em branch release-test/** ou workflow_dispatch: só gera os pacotes como
# artefatos, sem publicar (teste do pipeline; o dispatch exige o arquivo na main).
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    branches:
      - "release-test/**"
  workflow_dispatch:
    inputs:
      shell:
        description: "Casca da janela: tauri (padrão desde a 0.7) ou pywebview (pacote antigo, para comparar)"
        type: choice
        options: [tauri, pywebview]
        default: tauri

env:
  PYTHONUTF8: "1"
  SHELL_KIND: ${{ inputs.shell || 'tauri' }}
  TAURI_CLI: "2.11.5"   # a 2.12 exige rustc 1.90; ver novodesenho/tauri.md

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tag = versão do pyproject e seção no CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build/release_notes.py "${GITHUB_REF_NAME}" --out release_notes.md
      - name: Notas (sem tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Execução manual de teste (sem tag)." > release_notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,        python: "3.14", name: macos-arm64 }
          # Último runner Intel do GitHub; usa build/constraints-macos-x86_64.txt (torch 2.2.2, numpy<2).
          # Se o rótulo sumir, o pacote Intel é feito localmente: python build/build.py --arch x86_64
          - { runner: macos-15-intel,  python: "3.11", name: macos-x86_64 }
          - { runner: windows-latest,  python: "3.14", name: windows-x86_64 }
          - { runner: ubuntu-latest,   python: "3.14", name: linux-x86_64 }
    runs-on: ${{ matrix.runner }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}   # submódulo privado libs/ttwtools
          # Sem LFS: só ttwa_files/ (exemplos) está no LFS e o build não usa.

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            environment.yml
            build/constraints-*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Cache do PyInstaller
        uses: actions/cache@v4
        with:
          path: build/_work
          key: pyinstaller-${{ matrix.name }}-${{ hashFiles('environment.yml', 'build/constraints-*.txt', 'build/ttwtools-app.spec') }}

      # ── Casca Tauri (Rust): só quando SHELL_KIND = tauri ──────────────
      - name: Rust
        if: env.SHELL_KIND == 'tauri'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust (dependências e compilação)
        if: env.SHELL_KIND == 'tauri'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências do Tauri no Linux
        if: env.SHELL_KIND == 'tauri' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Cache do tauri-cli
        if: env.SHELL_KIND == 'tauri'
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ env.TAURI_CLI }}-${{ runner.os }}-${{ runner.arch }}

      - name: tauri-cli
        if: env.SHELL_KIND == 'tauri' && steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version =${{ env.TAURI_CLI }} --locked

      # build.py: dependências, frontend, PyInstaller, --selftest do binário,
      # check_macos_min (macOS) e pacote em dist/release/.
      # Com Tauri: build.py faz só o servidor e tauri_app.py monta a janela + servidor e empacota.
      - name: Build (pywebview)
        if: env.SHELL_KIND != 'tauri'
        run: python build/build.py --install-deps

      - name: Build do servidor (Tauri)
        if: env.SHELL_KIND == 'tauri'
        run: python build/build.py --install-deps --shell tauri

      - name: Janela Tauri e pacote
        if: env.SHELL_KIND == 'tauri'
        run: python build/tauri_app.py --package

      # ── Assinatura (D4, pendente) ─────────────────────────────────────
      # macOS: precisa de conta Apple Developer, certificado "Developer ID
      # Application" (secrets MACOS_CERT_P12, MACOS_CERT_PASSWORD) e senha de app
      # para notarização (APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD):
      #   codesign --deep --force --options runtime --sign "Developer ID Application: ..." dist/<alvo>/TTWtools.app
      #   xcrun notarytool submit dist/release/*.dmg --apple-id ... --team-id ... --password ... --wait
      #   xcrun stapler staple dist/release/*.dmg
      # Windows: certificado de assinatura de código (WINDOWS_CERT_PFX, WINDOWS_CERT_PASSWORD):
      #   signtool sign /f cert.pfx /p ... /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\windows-x86_64\TTWtools\TTWtools.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkgs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: SHA256SUMS
        working-directory: pkgs
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TTWtools ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}   # -alpha, -beta, -rc
          files: pkgs/*
