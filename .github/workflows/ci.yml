name: CI

# Rápido, a cada push e PR: dependências, testes, frontend e --version. Sem PyInstaller.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}   # submódulo privado libs/ttwtools
          # Sem LFS: só ttwa_files/ (exemplos, 500 MB) está no LFS e nada aqui usa.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            environment.yml
            build/constraints-*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      - name: Dependências
        run: |
          python build/build.py --install-deps --deps-only
          pip install pytest

      - name: Testes
        run: |
          pytest tests -q
          pytest libs/ttwtools/tests -q

      - name: Frontend
        working-directory: frontend-src
        run: npm ci && npm run build

      - name: Versão
        run: python -m app --version
