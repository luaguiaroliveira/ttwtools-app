[package]
name = "ttwtools-tauri"
version = "0.0.1"
description = "Casca Tauri do TTWtools (spike F1; ver novodesenho/tauri.md)"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
percent-encoding = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
